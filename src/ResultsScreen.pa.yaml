##
## Screen: ResultsScreen
## Purpose : Display group-order numbers that appear in BOTH uploaded CSV files,
##           together with all associated Date/Time values (column K) from each file.
##

- ResultsScreen:
    Control: Screen
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
    Children:

    ## ── Header bar ────────────────────────────────────────────────────────────
    - ResultsHeaderRect:
        Control: Rectangle
        Properties:
          X: =0
          Y: =0
          Width: =Parent.Width
          Height: =64
          Fill: =RGBA(0, 120, 212, 1)

    - BackBtn:
        Control: Button
        Properties:
          X: =12
          Y: =12
          Width: =100
          Height: =40
          Text: ="← Back"
          Color: =RGBA(255, 255, 255, 1)
          Fill: =RGBA(255, 255, 255, 30)
          HoverFill: =RGBA(255, 255, 255, 60)
          PressedFill: =RGBA(255, 255, 255, 80)
          BorderColor: =RGBA(255, 255, 255, 80)
          BorderThickness: =1
          FontWeight: =FontWeight.Bold
          Size: =13
          RadiusTopLeft: =4
          RadiusTopRight: =4
          RadiusBottomLeft: =4
          RadiusBottomRight: =4
          OnSelect: =Navigate(UploadScreen, ScreenTransition.Fade)

    - ResultsTitleLabel:
        Control: Label
        Properties:
          X: =124
          Y: =0
          Width: =Parent.Width - 300
          Height: =64
          Text: ="Matching Group Orders"
          Color: =RGBA(255, 255, 255, 1)
          Size: =22
          FontWeight: =FontWeight.Bold
          VerticalAlign: =VerticalAlign.Middle

    - MatchCountBadge:
        Control: Label
        Properties:
          X: =Parent.Width - 200
          Y: =14
          Width: =180
          Height: =36
          Text: =Text(CountRows(colMatches)) & " match(es) found"
          Color: =RGBA(255, 255, 255, 1)
          Fill: =RGBA(16, 124, 16, 1)
          Size: =12
          FontWeight: =FontWeight.Bold
          Align: =Align.Center
          VerticalAlign: =VerticalAlign.Middle
          RadiusTopLeft: =18
          RadiusTopRight: =18
          RadiusBottomLeft: =18
          RadiusBottomRight: =18

    ## ── Stats bar ─────────────────────────────────────────────────────────────
    - StatsBarRect:
        Control: Rectangle
        Properties:
          X: =0
          Y: =64
          Width: =Parent.Width
          Height: =48
          Fill: =RGBA(224, 239, 255, 1)

    - StatsLabel:
        Control: Label
        Properties:
          X: =20
          Y: =64
          Width: =Parent.Width - 40
          Height: =48
          Text: ="File 1: " & Text(varFile1RowCount) & " data rows  |  File 2: "
              & Text(varFile2RowCount) & " data rows  |  "
              & Text(CountRows(colMatches)) & " group order(s) matched across both files"
          Color: =RGBA(0, 80, 160, 1)
          Size: =12
          VerticalAlign: =VerticalAlign.Middle

    ## ── Column headers ────────────────────────────────────────────────────────
    - ColHeaderRect:
        Control: Rectangle
        Properties:
          X: =16
          Y: =124
          Width: =Parent.Width - 32
          Height: =36
          Fill: =RGBA(230, 235, 240, 1)
          BorderColor: =RGBA(200, 210, 220, 1)
          BorderThickness: =1

    - ColHeaderGroupOrder:
        Control: Label
        Properties:
          X: =24
          Y: =124
          Width: =220
          Height: =36
          Text: ="Group Order (Col D)"
          Color: =RGBA(50, 60, 70, 1)
          Size: =11
          FontWeight: =FontWeight.Bold
          VerticalAlign: =VerticalAlign.Middle

    - ColHeaderFile1:
        Control: Label
        Properties:
          X: =252
          Y: =124
          Width: =(Parent.Width - 284) / 2
          Height: =36
          Text: ="File 1 — Date/Time (Col K)"
          Color: =RGBA(50, 60, 70, 1)
          Size: =11
          FontWeight: =FontWeight.Bold
          VerticalAlign: =VerticalAlign.Middle

    - ColHeaderFile2:
        Control: Label
        Properties:
          X: =260 + (Parent.Width - 284) / 2
          Y: =124
          Width: =(Parent.Width - 284) / 2
          Height: =36
          Text: ="File 2 — Date/Time (Col K)"
          Color: =RGBA(50, 60, 70, 1)
          Size: =11
          FontWeight: =FontWeight.Bold
          VerticalAlign: =VerticalAlign.Middle

    ## ── Results gallery ───────────────────────────────────────────────────────
    - MatchesGallery:
        Control: Gallery
        Properties:
          X: =16
          Y: =160
          Width: =Parent.Width - 32
          Height: =Parent.Height - 176
          Items: =colMatches
          Layout: =Layout.Vertical
          TemplatePadding: =0
          TemplateSize: =90
          BorderColor: =RGBA(210, 220, 230, 1)
          BorderThickness: =1
        Children:

        ## ── Gallery item background ───────────────────────────────────────────
        - ItemBgRect:
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth
              Height: =Parent.TemplateHeight
              Fill: =If(IsEven(ThisItem.ItemIndex), RGBA(255, 255, 255, 1), RGBA(248, 250, 252, 1))
              BorderColor: =RGBA(220, 228, 236, 1)
              BorderThickness: =0

        - ItemDivider:
            Control: Rectangle
            Properties:
              X: =0
              Y: =Parent.TemplateHeight - 1
              Width: =Parent.TemplateWidth
              Height: =1
              Fill: =RGBA(220, 228, 236, 1)

        ## ── Index badge ──────────────────────────────────────────────────────
        - IndexBadge:
            Control: Label
            Properties:
              X: =8
              Y: =28
              Width: =32
              Height: =32
              Text: =Text(ThisItem.ItemIndex)
              Color: =RGBA(255, 255, 255, 1)
              Fill: =RGBA(0, 120, 212, 1)
              Size: =11
              FontWeight: =FontWeight.Bold
              Align: =Align.Center
              VerticalAlign: =VerticalAlign.Middle
              RadiusTopLeft: =16
              RadiusTopRight: =16
              RadiusBottomLeft: =16
              RadiusBottomRight: =16

        ## ── Group Order number ────────────────────────────────────────────────
        - GroupOrderLabel:
            Control: Label
            Properties:
              X: =48
              Y: =8
              Width: =196
              Height: =74
              Text: =ThisItem.GroupOrder
              Color: =RGBA(0, 80, 160, 1)
              Size: =18
              FontWeight: =FontWeight.Bold
              VerticalAlign: =VerticalAlign.Middle
              Wrap: =false

        ## ── Occurrence counts ─────────────────────────────────────────────────
        - OccurrencesLabel:
            Control: Label
            Properties:
              X: =48
              Y: =62
              Width: =196
              Height: =20
              Text: ="x" & Text(ThisItem.File1OccurrenceCount) & " in F1  •  x"
                  & Text(ThisItem.File2OccurrenceCount) & " in F2"
              Color: =RGBA(100, 110, 120, 1)
              Size: =10
              VerticalAlign: =VerticalAlign.Middle

        ## ── Vertical separator ────────────────────────────────────────────────
        - ColSeparator:
            Control: Rectangle
            Properties:
              X: =244
              Y: =8
              Width: =1
              Height: =Parent.TemplateHeight - 16
              Fill: =RGBA(210, 220, 230, 1)

        ## ── File 1 date/time values ──────────────────────────────────────────
        - File1IconLabel:
            Control: Label
            Properties:
              X: =252
              Y: =4
              Width: =50
              Height: =20
              Text: ="FILE 1"
              Color: =RGBA(0, 120, 212, 1)
              Size: =9
              FontWeight: =FontWeight.Bold

        - File1DateTimeLabel:
            Control: Label
            Properties:
              X: =252
              Y: =22
              Width: =(Parent.TemplateWidth - 284) / 2
              Height: =62
              Text: =Left(
                  ThisItem.File1DateTimes,
                  Len(ThisItem.File1DateTimes) - 3
                )
              Color: =RGBA(30, 40, 50, 1)
              Size: =12
              Wrap: =true
              VerticalAlign: =VerticalAlign.Top

        ## ── Middle separator ─────────────────────────────────────────────────
        - MidSeparator:
            Control: Rectangle
            Properties:
              X: =260 + (Parent.TemplateWidth - 284) / 2
              Y: =8
              Width: =1
              Height: =Parent.TemplateHeight - 16
              Fill: =RGBA(210, 220, 230, 1)

        ## ── File 2 date/time values ──────────────────────────────────────────
        - File2IconLabel:
            Control: Label
            Properties:
              X: =268 + (Parent.TemplateWidth - 284) / 2
              Y: =4
              Width: =50
              Height: =20
              Text: ="FILE 2"
              Color: =RGBA(0, 120, 212, 1)
              Size: =9
              FontWeight: =FontWeight.Bold

        - File2DateTimeLabel:
            Control: Label
            Properties:
              X: =268 + (Parent.TemplateWidth - 284) / 2
              Y: =22
              Width: =(Parent.TemplateWidth - 284) / 2
              Height: =62
              Text: =Left(
                  ThisItem.File2DateTimes,
                  Len(ThisItem.File2DateTimes) - 3
                )
              Color: =RGBA(30, 40, 50, 1)
              Size: =12
              Wrap: =true
              VerticalAlign: =VerticalAlign.Top

    ## ── Empty state (no matches) ──────────────────────────────────────────────
    - NoMatchesPanel:
        Control: Rectangle
        Properties:
          X: =16
          Y: =160
          Width: =Parent.Width - 32
          Height: =200
          Fill: =RGBA(255, 255, 255, 1)
          BorderColor: =RGBA(210, 220, 230, 1)
          BorderThickness: =1
          Visible: =CountRows(colMatches) = 0

    - NoMatchesLabel:
        Control: Label
        Properties:
          X: =16
          Y: =220
          Width: =Parent.Width - 32
          Height: =80
          Text: ="No matching group orders were found between the two files."
          Color: =RGBA(100, 110, 120, 1)
          Size: =16
          Align: =Align.Center
          VerticalAlign: =VerticalAlign.Middle
          Visible: =CountRows(colMatches) = 0
